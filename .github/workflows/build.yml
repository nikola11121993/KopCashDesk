name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore and security audit
        run: dotnet restore KopCashDesk.slnx
      - name: Build
        run: dotnet build KopCashDesk.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test tests/KopCashDesk.Tests/KopCashDesk.Tests.csproj --configuration Release --no-restore --logger "trx;LogFileName=tests.trx"
      - name: Publish Windows x64
        run: dotnet publish src/KopCashDesk.Desktop/KopCashDesk.Desktop.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=false --output artifacts/KopCashDesk
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path artifacts/KopCashDesk/* -DestinationPath artifacts/KopCashDesk-win-x64.zip
      - name: Upload portable application
        id: portable
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: KopCashDesk-win-x64
          path: artifacts/KopCashDesk-win-x64.zip
          if-no-files-found: error
          retention-days: 1
      - name: Upload test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
          retention-days: 1
      - name: Report delivery status
        if: always()
        shell: pwsh
        run: |
          if ('${{ steps.portable.outcome }}' -ne 'success') {
            "### Actions artifact upload unavailable`nCompilation and tests have separate results. The ZIP could not be uploaded to Actions storage. A separate preview release is attempted only after a successful build." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
  preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish verified source
        run: dotnet publish src/KopCashDesk.Desktop/KopCashDesk.Desktop.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=false --output artifacts/KopCashDesk
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path artifacts/KopCashDesk/* -DestinationPath artifacts/KopCashDesk-win-x64.zip
      - name: Publish preview release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$project = Get-Content 'src/KopCashDesk.Desktop/KopCashDesk.Desktop.csproj'
          $version = [string]($project.Project.PropertyGroup.Version | Select-Object -First 1)
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Version is missing in KopCashDesk.Desktop.csproj' }
          $tag = "v$version-preview"
          $asset = 'artifacts/KopCashDesk-win-x64.zip'
          $title = "КОП Кассы $version — единый импорт и исправление дублей"
          $notes = "Версия $version. Один импорт для Сбер/Такском/Frontol/CRPT; поддержка архивов ККТ .crpt; исправление дублей между Такском и Frontol; при запуске выполняется очистка уже накопленных дублей. Windows-сборка теперь многофайловая self-contained вместо тяжёлого single-file EXE для более быстрого запуска. Commit: $env:GITHUB_SHA"
          gh release view $tag --json tagName *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $asset --title $title --notes $notes --prerelease --target $env:GITHUB_SHA
          } else {
            gh release upload $tag $asset --clobber
            if ($LASTEXITCODE -eq 0) { gh release edit $tag --title $title --notes $notes --target $env:GITHUB_SHA }
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
